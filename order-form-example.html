<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Form Order — Contoh untuk Landing Page</title>
<style>
  body{ font-family: 'Plus Jakarta Sans', Arial, sans-serif; background:#161D28; color:#EAEEF5; padding:40px; }
  .box{ max-width:420px; margin:0 auto; background:#1F2836; border:1px solid #34405640; border-radius:14px; padding:26px; }
  label{ font-size:.8rem; color:#8D98AC; font-weight:600; display:block; margin:14px 0 5px; }
  input, select, textarea{ width:100%; background:#00000030; border:1px solid #34405640; border-radius:8px; color:#EAEEF5; padding:9px 11px; font-size:.9rem; box-sizing:border-box;}
  button{ margin-top:18px; width:100%; background:#E8A33D; color:#1A1204; font-weight:700; border:none; border-radius:9px; padding:11px; cursor:pointer; }
  #msg{ margin-top:12px; font-size:.85rem; }
</style>
</head>
<body>

<!-- ===========================================================
  CARA PAKAI DI SETIAP LANDING PAGE (repo GitHub Pages berbeda):
  1. Copy blok <div class="box">...</div> dan <script> di bawah ini
     ke halaman landing page Anda.
  2. Copy juga file assets/config.js dari project ini ke repo LP
     tersebut (isi sudah sama, tidak perlu diubah lagi).
  3. Ganti "PILIH_SALAH_SATU" pada SOURCE_LP_NAME sesuai nama LP
     ini di tabel landing_pages (harus sama persis dengan nama
     yang ada di tab Pengaturan dashboard).
=========================================================== -->

<div class="box">
  <h2 style="margin-top:0">Form Order</h2>
  <label>Nama</label>
  <input id="o_name" placeholder="Nama Anda" />
  <label>No. WhatsApp / Email</label>
  <input id="o_contact" placeholder="08xxxxxxxxxx" />
  <label>Jenis pekerjaan</label>
  <select id="o_service"></select>
  <label>Catatan (opsional)</label>
  <textarea id="o_notes" rows="3" placeholder="Detail kebutuhan Anda"></textarea>
  <button id="submitBtn">Kirim Order</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="assets/config.js"></script>
<script>
  // Nama landing page ini PERSIS seperti yang didaftarkan di tab
  // "Pengaturan" pada dashboard (tabel landing_pages).
  const SOURCE_LP_NAME = "PILIH_SALAH_SATU"; // contoh: "Jasa Meja Pintar"

  const sb = window.supabase.createClient(window.NAFA_CONFIG.SUPABASE_URL, window.NAFA_CONFIG.SUPABASE_ANON_KEY);
  emailjs.init({ publicKey: window.NAFA_CONFIG.EMAILJS_PUBLIC_KEY });

  let SERVICE_TYPES = [];
  let LP_ID = null;

  async function initForm(){
    const { data: services } = await sb.from('service_types').select('*').eq('active', true);
    SERVICE_TYPES = services || [];
    document.getElementById('o_service').innerHTML = SERVICE_TYPES.map(s => `<option value="${s.id}" data-hours="${s.default_hours}">${s.name}</option>`).join('');

    const { data: lps } = await sb.from('landing_pages').select('*').eq('name', SOURCE_LP_NAME);
    if(lps && lps.length > 0) LP_ID = lps[0].id;
  }
  initForm();

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('msg');
    const customer_name = document.getElementById('o_name').value.trim();
    const contact = document.getElementById('o_contact').value.trim();
    const service_type_id = document.getElementById('o_service').value;
    const notes = document.getElementById('o_notes').value.trim();
    const opt = document.getElementById('o_service').selectedOptions[0];
    const estimated_hours = opt ? Number(opt.dataset.hours) : 4;

    if(!customer_name || !contact || !service_type_id){
      msgEl.textContent = "Mohon lengkapi nama, kontak, dan jenis pekerjaan.";
      msgEl.style.color = "#E06B54";
      return;
    }

    const { data, error } = await sb.from('orders').insert({
      customer_name, contact, service_type_id, landing_page_id: LP_ID,
      notes, estimated_hours, status: 'waiting'
    }).select().single();

    if(error){
      msgEl.textContent = "Gagal mengirim order: " + error.message;
      msgEl.style.color = "#E06B54";
      return;
    }

    // Kirim notifikasi email ke Nafatechid@gmail.com via EmailJS
    let emailWarning = '';
    try{
      const serviceName = SERVICE_TYPES.find(s => s.id === service_type_id)?.name || '-';
      await emailjs.send(window.NAFA_CONFIG.EMAILJS_SERVICE_ID, window.NAFA_CONFIG.EMAILJS_TEMPLATE_ID, {
        to_email: window.NAFA_CONFIG.NOTIF_EMAIL,
        email: window.NAFA_CONFIG.NOTIF_EMAIL,
        queue_number: data.queue_number,
        customer_name, contact, service_name: serviceName,
        source_lp: SOURCE_LP_NAME,
        notes: notes || '-',
        order_time: new Date(data.created_at).toLocaleString('id-ID')
      });
    }catch(e){
      emailWarning = ' (Notifikasi email GAGAL: ' + (e?.text || e?.message || JSON.stringify(e)) + ')';
    }

    msgEl.style.color = emailWarning ? "#E8A33D" : "#4FB57F";
    msgEl.textContent = `Order terkirim! Nomor antrian Anda: #${data.queue_number}${emailWarning}`;
    document.getElementById('o_name').value = '';
    document.getElementById('o_contact').value = '';
    document.getElementById('o_notes').value = '';
  });
</script>
</body>
</html>
