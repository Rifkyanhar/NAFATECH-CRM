<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pesan Layanan — NAFA Tech</title>
<style>
  :root{
    --ink:#0B1220; --panel:#121B2E; --panel-2:#182339; --line:#25324A;
    --text:#E8EDF5; --muted:#8B98AC; --mint:#3DDC97; --amber:#F5A623;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ink);color:var(--text);min-height:100vh;padding:24px 16px;}
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;line-height:1.5;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:12px 13px;border-radius:10px;font-size:15px;outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mint);}
  .field textarea{min-height:100px;resize:vertical;}
  .promo-badge{display:inline-block;background:var(--amber);color:#2A1A00;font-size:11px;font-weight:700;
    padding:3px 10px;border-radius:100px;margin-bottom:14px;}
  .btn-submit{width:100%;background:var(--mint);color:#04140D;border:none;border-radius:10px;
    padding:15px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed;}
  .msg{font-size:13.5px;margin-top:12px;line-height:1.5;}
  .msg.error{color:#FF8A8A;}
  .msg.success{color:var(--mint);}
  .price-tag{color:var(--mint);font-weight:700;}
  .empty-state{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="promoBadgeWrap"></div>
  <h1>Pesan Layanan NAFA Tech</h1>
  <p class="sub">Isi data di bawah, tim kami akan segera menghubungi Anda untuk konfirmasi.</p>

  <div class="card">
    <div id="formArea">
      <div class="field">
        <label>Nama Anda</label>
        <input id="p_customer" placeholder="Nama lengkap">
      </div>
      <div class="field">
        <label>Kontak (WA aktif)</label>
        <input id="p_contact" placeholder="08xxxxxxxxxx">
      </div>
      <div class="field">
        <label>Pilih Layanan</label>
        <select id="p_service"></select>
      </div>
      <div class="field">
        <label>Detail / Catatan Pekerjaan</label>
        <textarea id="p_notes" placeholder="Ceritakan kebutuhan Anda: nama instansi/resto, jumlah pengguna, fitur yang diinginkan, dll."></textarea>
      </div>
      <button class="btn-submit" id="submitBtn" onclick="submitOrder()">Kirim Pesanan</button>
      <div class="msg" id="formMsg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
const sb = window.supabase.createClient(window.NAFA_CONFIG.SUPABASE_URL, window.NAFA_CONFIG.SUPABASE_ANON_KEY);
let SERVICE_TYPES = [];

function fmtRupiah(v){
  if(v === null || v === undefined || v === '') return '-';
  return 'Rp' + Number(v).toLocaleString('id-ID');
}

// Logic sama persis dengan yang dipakai di dashboard admin (app.js) --
// kalau ada layanan promo yang jendela tanggalnya aktif hari ini,
// tampilkan HANYA layanan-layanan promo itu. Kalau tidak, tampilkan
// semua layanan normal (non-promo) seperti biasa.
function getVisibleServiceTypes(){
  const today = new Date().getDate();
  const activeServices = SERVICE_TYPES.filter(s =>
    s.active && s.is_promo_scheduled &&
    today >= s.promo_day_start && today <= s.promo_day_end
  );
  if(activeServices.length > 0) return activeServices;
  return SERVICE_TYPES.filter(s => s.active && !s.is_promo_scheduled);
}

async function loadServices(){
  const { data, error } = await sb.from('service_types').select('*').order('created_at');
  const formMsg = document.getElementById('formMsg');
  if(error){
    document.getElementById('formArea').innerHTML = '<div class="empty-state">Gagal memuat daftar layanan. Coba refresh halaman ini.</div>';
    return;
  }
  SERVICE_TYPES = data || [];
  const visible = getVisibleServiceTypes();
  const isPromo = visible.length > 0 && visible[0].is_promo_scheduled;

  if(isPromo){
    document.getElementById('promoBadgeWrap').innerHTML = '<div class="promo-badge">🔥 PROMO AKTIF SAMPAI TANGGAL 15</div>';
  }

  const select = document.getElementById('p_service');
  if(visible.length === 0){
    document.getElementById('formArea').innerHTML = '<div class="empty-state">Belum ada layanan yang bisa dipesan saat ini. Silakan hubungi kami langsung.</div>';
    return;
  }
  select.innerHTML = visible.map(s=>{
    const price = s.is_promo_scheduled ? s.promo_price : s.default_price;
    return `<option value="${s.id}">${s.name} — ${fmtRupiah(price)}</option>`;
  }).join('');
}

async function submitOrder(){
  const customer_name = document.getElementById('p_customer').value.trim();
  const contact = document.getElementById('p_contact').value.trim();
  const service_type_id = document.getElementById('p_service').value;
  const notes = document.getElementById('p_notes').value.trim();
  const msgEl = document.getElementById('formMsg');
  const btn = document.getElementById('submitBtn');
  msgEl.className = 'msg';
  msgEl.textContent = '';

  if(!customer_name || !contact){
    msgEl.className = 'msg error';
    msgEl.textContent = 'Nama dan kontak wajib diisi.';
    return;
  }
  const service = SERVICE_TYPES.find(s => s.id === service_type_id);
  if(!service){
    msgEl.className = 'msg error';
    msgEl.textContent = 'Layanan belum dipilih atau tidak valid. Coba refresh halaman.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Mengirim...';

  const { error } = await sb.from('orders').insert({
    customer_name,
    contact,
    service_type_id,
    estimated_hours: service.default_hours,
    notes: notes || null,
    status: 'waiting'
  });

  btn.disabled = false;
  btn.textContent = 'Kirim Pesanan';

  if(error){
    msgEl.className = 'msg error';
    msgEl.textContent = 'Gagal mengirim pesanan: ' + error.message;
    return;
  }

  document.getElementById('formArea').innerHTML =
    '<div class="empty-state" style="color:var(--mint);">✅ Pesanan Anda berhasil dikirim!<br><br>Tim kami akan segera menghubungi Anda di ' + contact + ' untuk konfirmasi selanjutnya.</div>';
}

loadServices();
</script>
</body>
</html>
